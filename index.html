<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحضير الصف الثاني ب</title>
<style>
  /* الثيم الافتراضي: أزرق ملكي بجودة عالية */
  :root {
    --bg-color: #0F172A;
    --panel-bg: #1E293B;
    --text-color: #FFFFFF;
    --accent-color: #60A5FA;
    --input-bg: #334155;
    --btn-hover: #1D4ED8;
  }

  /* ثيم أزرق ملكي متطور */
  [data-theme="blue"] {
    --bg-color: #0B132B;
    --panel-bg: #1C2541;
    --text-color: #FFFFFF;
    --accent-color: #4CC9F0;
    --input-bg: #3A506B;
    --btn-hover: #4361EE;
  }

  /* ثيم داكن فاخر */
  [data-theme="dark"] {
    --bg-color: #0F172A;
    --panel-bg: #1E293B;
    --text-color: #FFFFFF;
    --accent-color: #FACC15;
    --input-bg: #334155;
    --btn-hover: #16A34A;
  }

  /* ثيم فاتح نظيف */
  [data-theme="light"] {
    --bg-color: #F1F5F9;
    --panel-bg: #FFFFFF;
    --text-color: #0F172A;
    --accent-color: #2563EB;
    --input-bg: #E2E8F0;
    --btn-hover: #15803D;
  }

  /* ثيم أخضر هادئ */
  [data-theme="green"] {
    --bg-color: #064E3B;
    --panel-bg: #022C22;
    --text-color: #FFFFFF;
    --accent-color: #34D399;
    --input-bg: #065F46;
    --btn-hover: #047857;
  }

  body { font-family: Cairo, sans-serif; direction: rtl; background: var(--bg-color); color: var(--text-color); padding: 15px; margin: 0; transition: 0.3s; }
  h2 { text-align: center; color: var(--accent-color); margin-bottom: 20px; font-weight: 800; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
  
  /* شاشة قفل الرقم السري */
  #lockScreen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-color); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
  .lock-box { background: var(--panel-bg); padding: 30px; border-radius: 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 90%; max-width: 350px; border: 1px solid rgba(255,255,255,0.1); }
  .lock-box input { background: var(--input-bg); color: var(--text-color); border: none; padding: 12px; font-size: 18px; border-radius: 8px; width: 80%; text-align: center; margin-bottom: 15px; outline: none; letter-spacing: 5px; }
  .lock-box button { background: #3B82F6; color: #fff; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; box-shadow: 0 4px 10px rgba(59, 130, 246, 0.4); }
  .error-msg { color: #EF4444; margin-top: 10px; font-size: 14px; display: none; }

  /* محتوى الصفحة الأساسي */
  #mainContent { display: none; max-width: 650px; margin: 0 auto; }
  
  /* لوحة التحكم العلوية */
  .control-panel { background: var(--panel-bg); padding: 18px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 6px 12px rgba(0,0,0,0.3); display: flex; flex-direction: column; gap: 12px; border: 1px solid rgba(255,255,255,0.05); }
  .control-group { display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; }
  .control-group input, .control-group select { background: var(--input-bg); color: var(--text-color); padding: 8px 12px; border-radius: 6px; border: none; font-size: 14px; outline: none; width: 60%; text-align: center; }

  /* صف الطالب وأزرار الاختيار السريعة */
  .student-row { background: var(--panel-bg); padding: 12px 15px; margin: 10px 0; border-radius: 10px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.03); }
  @media(min-width: 500px) {
    .student-row { flex-direction: row; justify-content: space-between; align-items: center; }
  }
  .student-name { font-size: 15px; font-weight: bold; }
  
  /* تصميم أزرار الاختيار (Radio Buttons) */
  .radio-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .radio-group label { background: var(--input-bg); padding: 6px 12px; border-radius: 6px; font-size: 13px; cursor: pointer; transition: 0.2s; user-select: none; font-weight: bold; }
  .radio-group input { display: none; }
  
  /* تلوين الزر عند الاختيار بجودة عالية */
  .radio-group input:checked + span.present { background: #22C55E; color: #fff; box-shadow: 0 2px 6px rgba(34, 197, 94, 0.4); }
  .radio-group input:checked + span.absent { background: #EF4444; color: #fff; box-shadow: 0 2px 6px rgba(239, 68, 68, 0.4); }
  .radio-group input:checked + span.late { background: #EAB308; color: #000; box-shadow: 0 2px 6px rgba(234, 179, 8, 0.4); }
  .radio-group input:checked + span.excused { background: #0EA5E9; color: #fff; box-shadow: 0 2px 6px rgba(14, 165, 233, 0.4); }

  .radio-group span { display: inline-block; padding: 2px 6px; border-radius: 4px; }

  .save-btn { background: #3B82F6; color: #fff; border: none; padding: 15px; width: 100%; font-size: 18px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 6px 15px rgba(59, 130, 246, 0.4); transition: 0.2s; }
  .save-btn:hover { background: var(--btn-hover); transform: translateY(-1px); }
  .loading { text-align: center; color: #38BDF8; display: none; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body data-theme="blue">

<!-- شاشة قفل الرقم السري -->
<div id="lockScreen">
  <div class="lock-box">
    <h3>🔒 لوحة التحضير محمية</h3>
    <p style="color: #94A3B8; font-size: 14px; margin-bottom: 15px;">الرجاء إدخال الرقم السري (1234)</p>
    <input type="password" id="pinInput" placeholder="****" maxlength="4">
    <br>
    <button onclick="checkPin()">دخول</button>
    <div id="errorMsg" class="error-msg">الرقم السري غير صحيح!</div>
  </div>
</div>

<!-- محتوى الصفحة -->
<div id="mainContent">
  <h2>📝 تحضير الصف الثاني ب</h2>

  <!-- لوحة معلومات الحصة والتاريخ والثيمات -->
  <div class="control-panel">
    <div class="control-group">
      <span>🎨 اختر الثيم:</span>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="blue" selected>🔵 أزرق ملكي (عالي الجودة)</option>
        <option value="dark">🌙 داكن فاخر</option>
        <option value="light">☀️ فاتح نظيف</option>
        <option value="green">🌲 أخضر هادئ</option>
      </select>
    </div>
    <div class="control-group">
      <span>📅 التاريخ:</span>
      <input type="date" id="attendanceDate">
    </div>
    <div class="control-group">
      <span>📆 اليوم الدراسي:</span>
      <select id="attendanceDay">
        <option value="الأحد">الأحد</option>
        <option value="الإثنين">الإثنين</option>
        <option value="الثلاثاء">الثلاثاء</option>
        <option value="الأربعاء">الأربعاء</option>
        <option value="الخميس">الخميس</option>
      </select>
    </div>
    <div class="control-group">
      <span>📚 الفصل الدراسي:</span>
      <select id="semester">
        <option value="الفصل الدراسي الأول">الفصل الدراسي الأول</option>
        <option value="الفصل الدراسي الثاني">الفصل الدراسي الثاني</option>
      </select>
    </div>
  </div>

  <div id="formContainer"></div>

  <button class="save-btn" onclick="sendToGoogleSheet()">💾 حفظ وإرسال إلى قوقل درايف</button>
  <div id="loadingText" class="loading">جاري إرسال البيانات وحفظها في الدرايف...</div>
</div>

<script>
  // تغيير الثيم وحفظه في المتصفح
  function changeTheme(themeName) {
    document.body.setAttribute('data-theme', themeName);
    localStorage.setItem('school_theme', themeName);
  }

  // استرجاع الثيم المحفوظ مسبقاً إن وجد
  const savedTheme = localStorage.getItem('school_theme');
  if (savedTheme) {
    document.body.setAttribute('data-theme', savedTheme);
    document.getElementById('themeSelect').value = savedTheme;
  }

  // تعيين تاريخ اليوم واليوم الدراسي تلقائياً
  document.getElementById('attendanceDate').valueAsDate = new Date();
  const daysMap = { "Sunday": "الأحد", "Monday": "الإثنين", "Tuesday": "الثلاثاء", "Wednesday": "الأربعاء", "Thursday": "الخميس", "Friday": "الأحد", "Saturday": "الأحد" };
  const currentDayName = new Intl.DateTimeFormat('en-US', { weekday: 'long' }).format(new Date());
  if (daysMap[currentDayName]) {
    document.getElementById('attendanceDay').value = daysMap[currentDayName];
  }

  // التحقق من الرقم السري
  function checkPin() {
    const pin = document.getElementById("pinInput").value;
    if (pin === "1234") {
      document.getElementById("lockScreen").style.display = "none";
      document.getElementById("mainContent").style.display = "block";
    } else {
      document.getElementById("errorMsg").style.display = "block";
      document.getElementById("pinInput").value = "";
    }
  }

  document.getElementById("pinInput").addEventListener("keypress", function(event) {
    if (event.key === "Enter") { checkPin(); }
  });

  // رابط السكربت الخاص بك
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyv3LnEKPCMeVihvmqhBL7JsHMtggpOQW5oda2IiDRsZX5NuTMQG2F3yt4yp3w9c8-lmQ/exec";

  // قائمة طلاب الصف الثاني ب الكاملة
  const studentsList = [
    "البراء ماجد حمدان السلمي",
    "السنوسي حسن عمر هارون",
    "الوليد ماجد رشيد السلمى",
    "امير يوسف احجل",
    "بهاء مخضور بن مطلق الصاطي",
    "تركي خالد عبدالله السلمي",
    "تميم ريان حاتم",
    "جلال علي صباح الخير",
    "حازم نواف وصل السلمي",
    "رائد ماجد محمد الدريويشي",
    "زيد فهد بن عالي السلمي",
    "عبدالرحمن عريمط المحلدي",
    "عبدالله مجدي حميد المحلدي",
    "عز عدنان بن عبدالله الصاطي",
    "عمرو ابراهيم عبدالله ابراهيم",
    "فيصل سامي بتاء السلمي",
    "فيصل نواف مفلح المنقاشي",
    "محمد طيب الظبيبي",
    "مهدي فريد احمد",
    "يزن عبدالله محمد الشيخ",
    "يوسف علي صباح الخير",
    "يوسف ماجد علاوي السلمي"
  ];

  const container = document.getElementById("formContainer");

  studentsList.forEach((name, index) => {
    const row = document.createElement("div");
    row.className = "student-row";
    row.innerHTML = `
      <span class="student-name">${index + 1}. ${name}</span>
      <div class="radio-group">
        <label><input type="radio" name="status_${index}" value="حاضر" checked><span class="present">حاضر</span></label>
        <label><input type="radio" name="status_${index}" value="غائب"><span class="absent">غائب</span></label>
        <label><input type="radio" name="status_${index}" value="متأخر"><span class="late">متأخر</span></label>
        <label><input type="radio" name="status_${index}" value="غياب بعذر"><span class="excused">بعذر</span></label>
      </div>
    `;
    container.appendChild(row);
  });

  async function sendToGoogleSheet() {
    const dateVal = document.getElementById("attendanceDate").value;
    if (!dateVal) {
      alert("الرجاء تحديد التاريخ أولاً!");
      return;
    }

    let dailyRecord = {
      date: dateVal,
      day: document.getElementById("attendanceDay").value,
      semester: document.getElementById("semester").value,
      students: []
    };

    studentsList.forEach((name, index) => {
      let selectedRadio = document.querySelector(`input[name="status_${index}"]:checked`);
      let status = selectedRadio ? selectedRadio.value : "حاضر";
      dailyRecord.students.push({ name: name, status: status });
    });

    document.getElementById("loadingText").style.display = "block";

    try {
      await fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dailyRecord)
      });

      document.getElementById("loadingText").style.display = "none";
      alert("تم إرسال وحفظ التحضير في قوقل درايف بنجاح! 🚀");
    } catch (error) {
      document.getElementById("loadingText").style.display = "none";
      alert("حدث خطأ أثناء الإرسال: " + error);
    }
  }
</script>

</body>
</html>
