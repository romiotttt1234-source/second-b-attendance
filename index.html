<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام تحضير طلاب الصف الثاني ب</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 5px;
        }
        .info-box {
            display: flex;
            justify-content: space-between;
            background: #eef2f3;
            padding: 12px 18px;
            border-radius: 8px;
            margin: 20px 0;
            font-weight: bold;
            color: #34495e;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 25px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: center;
        }
        th {
            background-color: #2c3e50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f9f9f9;
        }
        .status-options {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .status-options label {
            cursor: pointer;
            font-weight: 500;
        }
        .btn-submit {
            display: block;
            width: 100%;
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 14px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-submit:hover {
            background-color: #219653;
        }
        /* نافذة إدخال الرمز السري */
        #pinModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 320px;
        }
        .modal-content input {
            width: 100%;
            padding: 10px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 5px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .modal-content button {
            background: #2c3e50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
        }
        .error-msg {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <!-- نافذة طلب رمز الدخول (PIN: 1234) -->
    <div id="pinModal">
        <div class="modal-content">
            <h3>أدخل رمز الحماية</h3>
            <p style="font-size: 13px; color: #666;">الرجاء إدخال الرمز المكون من 4 أرقام للمتابعة</p>
            <input type="password" id="pinInput" maxlength="4" placeholder="••••">
            <button onclick="checkPin()">دخول</button>
            <div id="errorMsg" class="error-msg">الرمز غير صحيح، حاول مرة أخرى.</div>
        </div>
    </div>

    <div class="container" id="mainContent" style="display:none;">
        <h2>سجل حضور طلاب الصف الثاني ب</h2>
        
        <div class="info-box">
            <span id="currentDate">التاريخ: --</span>
            <span id="currentDay">اليوم: --</span>
        </div>

        <form id="attendanceForm">
            <table>
                <thead>
                    <tr>
                        <th style="width: 10%;">م</th>
                        <th style="width: 50%;">اسم الطالب</th>
                        <th style="width: 40%;">حالة الحضور</th>
                    </tr>
                </thead>
                <tbody id="studentsTableBody">
                    <!-- يتم تعبئة الطلاب تلقائياً عبر الكود -->
                </tbody>
            </table>
            
            <button type="button" class="btn-submit" onclick="submitAttendance()">حفظ وإرسال التحضير</button>
        </form>
    </div>

    <script>
        // الرمز السري المطلوب
        const CORRECT_PIN = "1234";

        function checkPin() {
            const enteredPin = document.getElementById("pinInput").value;
            const errorMsg = document.getElementById("errorMsg");

            if (enteredPin === CORRECT_PIN) {
                document.getElementById("pinModal").style.display = "none";
                document.getElementById("mainContent").style.display = "block";
            } else {
                errorMsg.style.display = "block";
                document.getElementById("pinInput").value = "";
            }
        }

        // قائمة الطلاب
        const students = [
            "البراء ماجد حمدان السلمي", "السنوسي حسن عمر هارون", "الوليد ماجد رشيد السلمى",
            "امير يوسف احجل", "بهاء مخضور بن مطلق الصاطي", "تركي خالد عبدالله السلمي",
            "تميم ريان حاتم", "جلال علي صباح الخير", "حازم نواف وصل السلمي",
            "رائد ماجد محمد الدريويشي", "زيد فهد بن عالي السلمي", "عبدالرحمن عريمط المحلدي",
            "عبدالله مجدي حميد المحلدي", "عز عدنان بن عبدالله الصاطي", "عمرو ابراهيم عبدالله ابراهيم",
            "فيصل سامي بتاء السلمي", "فيصل نواف مفلح المنقاشي", "محمد طيب الظبيبي",
            "مهدي فريد احمد", "يزن عبدالله محمد الشيخ", "يوسف علي صباح الخير",
            "يوسف ماجد علاوي السلمي"
        ];

        // رابط سكربت قوقل الجديد المحدث
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyxze7mIZHhOHQmthC_LDRg0YTiFOz30E_mUeN5OW_q-ZL5bbIPYhA_eMz5WnF7QkcKoA/exec";

        // تعبئة التاريخ واليوم وجدول الطلاب تلقائياً
        window.onload = function() {
            const now = new Date();
            
            // ضبط صيغة التاريخ (YYYY-MM-DD)
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;

            // جلب اسم اليوم بالعربي
            const daysNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const dayNameStr = daysNames[now.getDay()];

            document.getElementById("currentDate").innerText = "التاريخ: " + dateStr;
            document.getElementById("currentDay").innerText = "اليوم: " + dayNameStr;

            // بناء الجدول
            const tbody = document.getElementById("studentsTableBody");
            students.forEach((student, index) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="text-align: right; font-weight: 500;">${student}</td>
                    <td>
                        <div class="status-options">
                            <label style="color: #27ae60;"><input type="radio" name="student_${index}" value="حاضر" checked> حاضر</label>
                            <label style="color: #e74c3c;"><input type="radio" name="student_${index}" value="غائب"> غائب</label>
                            <label style="color: #f39c12;"><input type="radio" name="student_${index}" value="متأخر"> متأخر</label>
                        </div>
                    </td>
                `;
                tbody.appendChild(row);
            });
        };

        // إرسال البيانات إلى قوقل شيت
        function submitAttendance() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateStr = `${year}-${month}-${day}`;
            
            const daysNames = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
            const dayNameStr = daysNames[now.getDay()];

            let attendanceData = [];

            students.forEach((student, index) => {
                const radios = document.getElementsByName(`student_${index}`);
                let status = "حاضر";
                for (const radio of radios) {
                    if (radio.checked) {
                        status = radio.value;
                        break;
                    }
                }
                attendanceData.push({ name: student, status: status });
            });

            const payload = {
                date: dateStr,
                day: dayNameStr,
                students: attendanceData
            };

            const btn = document.querySelector(".btn-submit");
            btn.innerText = "جاري الحفظ والإرسال...";
            btn.disabled = true;

            fetch(SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert("تم تسجيل وحفظ التحضير بنجاح في قوقل شيت!");
                btn.innerText = "حفظ وإرسال التحضير";
                btn.disabled = false;
            })
            .catch(error => {
                console.error("Error!", error);
                alert("حدث خطأ أثناء الإرسال، تأكد من الاتصال بالإنترنت.");
                btn.innerText = "حفظ وإرسال التحضير";
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
